[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ddc-physical-gate"
version = "0.2.0"
description = "Simulation-only independent physical action assurance reference with cryptographic trust binding"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
ddc-physical-gate = "physical_gate.cli:main"
[tool.setuptools.packages.find]
include = ["physical_gate*"]
